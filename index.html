<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' ws: wss:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=(self), gyroscope=(self)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="./favicon.ico">
  <title>Weekly Game Factory</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      position: fixed;
      font-family: 'Outfit', system-ui, sans-serif;
      -webkit-overflow-scrolling: none;
      -webkit-text-size-adjust: 100%;
      touch-action: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
    }
    canvas {
      display: block;
    }
    #version-badge {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 4px 8px;
      border: 1px solid rgba(0, 200, 5, 0.45);
      background: rgba(0, 0, 0, 0.72);
      color: #00c805;
      font: 700 10px/1.2 'Outfit', system-ui, sans-serif;
      letter-spacing: 0;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }
    /* Floating Menu Buttons */
    #menu-buttons {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 20px;
      display: flex;
      gap: 10px;
      z-index: 1001;
    }
    .menu-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px dashed rgba(0, 200, 5, 0.45);
      color: #00c805;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px rgba(0, 200, 5, 0.1);
      transition: all 0.2s ease;
      touch-action: auto;
    }
    .menu-btn:hover {
      background: rgba(0, 200, 5, 0.15);
      border-color: #00c805;
      box-shadow: 0 0 15px rgba(0, 200, 5, 0.3);
    }
    /* Modals */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      touch-action: auto;
    }
    .modal-content {
      background: rgba(20, 20, 30, 0.95);
      border: 2px solid #00c805;
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
      color: #fff;
      box-shadow: 0 0 30px rgba(0, 200, 5, 0.25), inset 0 0 15px rgba(0, 200, 5, 0.1);
      animation: modalFadeIn 0.3s ease;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px dashed rgba(0, 200, 5, 0.3);
      padding-bottom: 10px;
    }
    .modal-header h2 {
      font-size: 22px;
      color: #00c805;
      text-shadow: 0 0 10px rgba(0, 200, 5, 0.3);
      letter-spacing: 1px;
    }
    .close-btn {
      background: none;
      border: none;
      color: #8e8e93;
      font-size: 24px;
      cursor: pointer;
    }
    .close-btn:hover {
      color: #fff;
    }
    /* Settings Options */
    .setting-item {
      margin-bottom: 20px;
    }
    .setting-item label {
      display: block;
      font-size: 14px;
      color: #8e8e93;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .sound-packs {
      display: flex;
      gap: 10px;
    }
    .sound-pack-btn {
      flex: 1;
      padding: 10px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #333;
      border-radius: 8px;
      color: #ccc;
      font-family: 'Outfit', sans-serif;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .sound-pack-btn.active {
      background: rgba(0, 200, 5, 0.15);
      border-color: #00c805;
      color: #00c805;
      box-shadow: 0 0 10px rgba(0, 200, 5, 0.2);
    }
    .sound-pack-btn:hover {
      border-color: #00c805;
      color: #fff;
    }
    .setting-slider {
      width: 100%;
      accent-color: #00c805;
      background: #333;
      height: 6px;
      border-radius: 3px;
      outline: none;
      margin-top: 5px;
    }
    /* Leaderboard Styles */
    .leaderboard-list {
      max-height: 250px;
      overflow-y: auto;
      margin-top: 10px;
      padding-right: 5px;
    }
    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 14px;
    }
    .leaderboard-item:last-child {
      border-bottom: none;
    }
    .leaderboard-name {
      color: #fff;
      font-weight: 500;
    }
    .leaderboard-score {
      color: #00c805;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(0, 200, 5, 0.2);
    }
    /* Custom Scrollbar for list */
    .leaderboard-list::-webkit-scrollbar {
      width: 4px;
    }
    .leaderboard-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .leaderboard-list::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 2px;
    }
    .leaderboard-list::-webkit-scrollbar-thumb:hover {
      background: #00c805;
    }
  </style>
  <!-- Basic Web App Manifest (PWA) -->
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="version-badge">v1.5.0 - AR & Customization</div>

  <!-- Floating Menu Buttons -->
  <div id="menu-buttons">
    <button class="menu-btn" id="scores-btn" title="Leaderboards">🏆</button>
    <button class="menu-btn" id="settings-btn" title="Sound Pack Settings">⚙️</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settings-modal">
    <div class="modal-content" style="max-width: 450px;">
      <div class="modal-header">
        <h2>Settings & Skins</h2>
        <button class="close-btn" onclick="toggleModal('settings-modal', false)">&times;</button>
      </div>
      <!-- Tab Header for settings -->
      <div style="display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px;">
        <button id="tab-sound-btn" class="sound-pack-btn active" style="flex: 1; padding: 8px; font-size: 13px; font-weight: bold; border-radius: 6px;" onclick="switchSettingsTab('sound')">Sound</button>
        <button id="tab-shop-btn" class="sound-pack-btn" style="flex: 1; padding: 8px; font-size: 13px; font-weight: bold; border-radius: 6px;" onclick="switchSettingsTab('shop')">Skin Shop</button>
      </div>
      
      <!-- Sound Settings Content -->
      <div id="tab-sound-content">
        <div class="setting-item">
          <label>Synth Sound Pack</label>
          <div class="sound-packs">
            <button class="sound-pack-btn" id="pack-retro" onclick="setSoundPack('retro')">Retro Synth</button>
            <button class="sound-pack-btn" id="pack-lofi" onclick="setSoundPack('lofi')">Lofi</button>
            <button class="sound-pack-btn" id="pack-arcade" onclick="setSoundPack('arcade')">Arcade</button>
          </div>
        </div>
        <div class="setting-item">
          <label>Master Synth Volume</label>
          <input type="range" class="setting-slider" id="volume-slider" min="0" max="100" value="50" oninput="updateVolume(this.value)">
        </div>
      </div>

      <!-- Skin Shop Content -->
      <div id="tab-shop-content" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px;">
          <span>Your Balance:</span>
          <span style="color: #00c805; font-weight: bold;" id="shop-credits-display">0 Credits</span>
        </div>
        <div id="shop-items-container" style="display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto;">
          <!-- Shop items dynamically filled -->
        </div>
      </div>
    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div class="modal" id="scores-modal">
    <div class="modal-content" style="max-width: 450px;">
      <div class="modal-header">
        <h2>Records & Badges</h2>
        <button class="close-btn" onclick="toggleModal('scores-modal', false)">&times;</button>
      </div>
      <!-- Tab Header -->
      <div style="display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; flex-wrap: wrap;">
        <button id="tab-leaderboard-btn" class="sound-pack-btn active" style="flex: 1; padding: 6px; font-size: 11px; font-weight: bold; border-radius: 6px; min-width: 80px;" onclick="switchScoresTab('leaderboard')">Leaderboard</button>
        <button id="tab-badges-btn" class="sound-pack-btn" style="flex: 1; padding: 6px; font-size: 11px; font-weight: bold; border-radius: 6px; min-width: 80px;" onclick="switchScoresTab('badges')">Badges</button>
        <button id="tab-profile-btn" class="sound-pack-btn" style="flex: 1; padding: 6px; font-size: 11px; font-weight: bold; border-radius: 6px; min-width: 80px;" onclick="switchScoresTab('profile')">Profile</button>
        <button id="tab-stats-btn" class="sound-pack-btn" style="flex: 1; padding: 6px; font-size: 11px; font-weight: bold; border-radius: 6px; min-width: 80px;" onclick="switchScoresTab('stats')">Stats</button>
      </div>
      <!-- Tab Contents -->
      <div id="tab-leaderboard-content" class="leaderboard-list" style="max-height: 350px; overflow-y: auto; padding-right: 4px;">
        <!-- Dynamically filled -->
      </div>
      <div id="tab-badges-content" style="display: none; max-height: 350px; overflow-y: auto; padding-right: 4px;">
        <!-- Dynamically filled -->
      </div>
      <div id="tab-profile-content" style="display: none; max-height: 350px; overflow-y: auto; padding-right: 4px;">
        <!-- Dynamically filled -->
      </div>
      <div id="tab-stats-content" style="display: none; max-height: 350px; overflow-y: auto; padding-right: 4px;">
        <!-- Dynamically filled -->
      </div>
    </div>
  </div>

  <!-- Fullscreen Game Iframe Overlay -->
  <div id="game-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background: #000; z-index: 9999;">
    <iframe id="game-iframe" style="width: 100%; height: 100%; border: none;" src="about:blank"></iframe>
    <button id="exit-btn" style="position: fixed; top: 20px; right: 20px; z-index: 10000; background: rgba(0, 0, 0, 0.7); border: 2px solid #00c805; color: #00c805; padding: 10px 20px; border-radius: 8px; font-family: 'Outfit', sans-serif; font-weight: bold; font-size: 14px; cursor: pointer; backdrop-filter: blur(4px); box-shadow: 0 0 10px rgba(0, 200, 5, 0.3); transition: all 0.2s ease;" onmouseover="this.style.background='rgba(0, 200, 5, 0.15)'" onmouseout="this.style.background='rgba(0, 0, 0, 0.7)'" onclick="closeGameIframe()">Exit to Hub</button>
  </div>

  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>

  <!-- Hub / PostMessage / Bridge Logic -->
  <script>
    // Initial Setting values
    if (!localStorage.getItem('wgf_soundpack')) {
      localStorage.setItem('wgf_soundpack', 'retro');
    }
    if (!localStorage.getItem('wgf_volume')) {
      localStorage.setItem('wgf_volume', '0.5');
    }
    if (!localStorage.getItem('wgf_player_credits')) {
      localStorage.setItem('wgf_player_credits', '100');
    }
    if (!localStorage.getItem('wgf_active_theme')) {
      localStorage.setItem('wgf_active_theme', 'classic');
    }
    if (!localStorage.getItem('wgf_unlocked_themes')) {
      localStorage.setItem('wgf_unlocked_themes', JSON.stringify(['classic']));
    }
    if (!localStorage.getItem('wgf_username')) {
      localStorage.setItem('wgf_username', 'RetroPlayer');
    }
    if (!localStorage.getItem('wgf_avatar')) {
      localStorage.setItem('wgf_avatar', '👾');
    }
    if (!localStorage.getItem('wgf_stats')) {
      localStorage.setItem('wgf_stats', JSON.stringify({
        gamesPlayed: 0,
        blocksBuilt: 0,
        metersRun: 0,
        creditsSpent: 0
      }));
    }

    const SHOP_THEMES = [
      { id: 'classic', name: 'Neon Classic', price: 0, desc: 'Original synthwave cyan/magenta glow theme' },
      { id: 'vector', name: 'Vector Wireframe', price: 200, desc: 'Retro monochrome green outline aesthetic' },
      { id: 'glitch', name: 'Neon Glitch', price: 300, desc: 'Deep chromatic aberration and magenta saturation' },
      { id: 'pastel', name: 'Retro Pastel', price: 300, desc: 'Soft pinks, peach tones, and sepia shading' }
    ];

    function applyThemeFilter() {
      const theme = localStorage.getItem('wgf_active_theme') || 'classic';
      if (theme === 'vector') {
        document.body.style.filter = 'hue-rotate(60deg) saturate(1.5) contrast(1.2) brightness(0.85)';
      } else if (theme === 'glitch') {
        document.body.style.filter = 'invert(0.1) hue-rotate(280deg) saturate(2.2) contrast(1.25)';
      } else if (theme === 'pastel') {
        document.body.style.filter = 'sepia(0.25) saturate(0.8) brightness(1.05)';
      } else {
        document.body.style.filter = 'none';
      }
    }
    applyThemeFilter();

    // Achievements and Badges Definition
    const ACHIEVEMENTS = [
      { id: 'first_score', title: 'Rookie Score', desc: 'Score your first points in any game', check: (game, score) => score > 0 },
      { id: 'invaders_elite', title: 'Galaxy Guard', desc: 'Reach 1,000 pts in Space Invaders', check: (game, score) => game === 'f1-space-invaders' && score >= 1000 },
      { id: 'cyber_voyager', title: 'Neon Dasher', desc: 'Run 1,500 meters in Cyberpunk Runner', check: (game, score) => game === 'cyberpunk-runner' && score >= 1500 },
      { id: 'td_commander', title: 'Voxel Architect', desc: 'Reach 300 score in Sci-Fi TD', check: (game, score) => game === 'sci-fi-td' && score >= 300 },
      { id: 'cargo_pilot', title: 'Golden Hauler', desc: 'Restored 200 score in Cosmic Cargo', check: (game, score) => game === 'cosmic-cargo' && score >= 200 },
      { id: 'pong_champ', title: 'Pong Master', desc: 'Reach 5 points in Red Bull Pong', check: (game, score) => game === 'red-bull-pong' && score >= 5 },
      { id: 'sandbox_architect', title: 'Grid Builder', desc: 'Placed blocks in Voxel Sandbox', check: (game, score) => game === 'voxel-sandbox' && score >= 1 },
      { id: 'two_thousand', title: 'Merge Expert', desc: 'Reach 512 score in 2048', check: (game, score) => game === '2048' && score >= 512 },
      { id: 'bird_wings', title: 'Pipe Dodger', desc: 'Score 10 in Clumsy Bird', check: (game, score) => game === 'clumsy-bird' && score >= 10 },
      { id: 'hextris_spin', title: 'Combo Hex', desc: 'Reach 200 score in Hextris', check: (game, score) => game === 'hextris' && score >= 200 },
      { id: 'pacman_ghost', title: 'Ghost Eater', desc: 'Reach 1,000 score in Pac-Man', check: (game, score) => game === 'pac-man' && score >= 1000 }
    ];

    // Modal helpers
    window.toggleModal = function(id, show) {
      const m = document.getElementById(id);
      m.style.display = show ? 'flex' : 'none';
      if (show) {
        if (id === 'scores-modal') {
          switchScoresTab('leaderboard');
        } else if (id === 'settings-modal') {
          switchSettingsTab('sound');
        }
      }
    }

    window.switchSettingsTab = function(tab) {
      const sndBtn = document.getElementById('tab-sound-btn');
      const shpBtn = document.getElementById('tab-shop-btn');
      const sndCont = document.getElementById('tab-sound-content');
      const shpCont = document.getElementById('tab-shop-content');
      
      if (tab === 'sound') {
        sndBtn.classList.add('active');
        shpBtn.classList.remove('active');
        sndCont.style.display = 'block';
        shpCont.style.display = 'none';
      } else {
        sndBtn.classList.remove('active');
        shpBtn.classList.add('active');
        sndCont.style.display = 'none';
        shpCont.style.display = 'block';
        populateShop();
      }
    };

    function populateShop() {
      const credits = parseInt(localStorage.getItem('wgf_player_credits') || '0');
      document.getElementById('shop-credits-display').innerText = `${credits} Credits`;
      
      const unlocked = JSON.parse(localStorage.getItem('wgf_unlocked_themes') || '["classic"]');
      const active = localStorage.getItem('wgf_active_theme') || 'classic';
      
      const container = document.getElementById('shop-items-container');
      container.innerHTML = '';
      
      SHOP_THEMES.forEach(t => {
        const item = document.createElement('div');
        item.style.display = 'flex';
        item.style.justifyContent = 'space-between';
        item.style.alignItems = 'center';
        item.style.padding = '8px 12px';
        item.style.background = 'rgba(255,255,255,0.02)';
        item.style.border = '1px solid rgba(255,255,255,0.06)';
        item.style.borderRadius = '6px';
        
        const details = document.createElement('div');
        details.style.flex = '1';
        
        const name = document.createElement('div');
        name.style.fontWeight = 'bold';
        name.style.fontSize = '13px';
        name.innerText = t.name;
        
        const desc = document.createElement('div');
        desc.style.fontSize = '10px';
        desc.style.color = '#8e8e93';
        desc.innerText = t.desc;
        
        details.appendChild(name);
        details.appendChild(desc);
        item.appendChild(details);
        
        const btn = document.createElement('button');
        btn.className = 'sound-pack-btn';
        btn.style.padding = '5px 10px';
        btn.style.fontSize = '11px';
        btn.style.fontWeight = 'bold';
        
        const isUnlocked = unlocked.includes(t.id);
        if (active === t.id) {
          btn.innerText = 'Active';
          btn.classList.add('active');
          btn.disabled = true;
        } else if (isUnlocked) {
          btn.innerText = 'Equip';
          btn.onclick = () => {
            localStorage.setItem('wgf_active_theme', t.id);
            applyThemeFilter();
            populateShop();
          };
        } else {
          btn.innerText = `Buy (${t.price})`;
          if (credits < t.price) {
            btn.style.opacity = '0.5';
            btn.disabled = true;
          } else {
            btn.onclick = () => {
              const newBal = credits - t.price;
              localStorage.setItem('wgf_player_credits', newBal.toString());
              unlocked.push(t.id);
              localStorage.setItem('wgf_unlocked_themes', JSON.stringify(unlocked));
              localStorage.setItem('wgf_active_theme', t.id);
              
              const stats = JSON.parse(localStorage.getItem('wgf_stats') || '{}');
              stats.creditsSpent = (stats.creditsSpent || 0) + t.price;
              localStorage.setItem('wgf_stats', JSON.stringify(stats));
              
              applyThemeFilter();
              populateShop();
            };
          }
        }
        
        item.appendChild(btn);
        container.appendChild(item);
      });
    }

    window.switchScoresTab = function(tab) {
      const tabs = ['leaderboard', 'badges', 'profile', 'stats'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}-btn`);
        const cont = document.getElementById(`tab-${t}-content`);
        if (t === tab) {
          btn.classList.add('active');
          cont.style.display = 'block';
        } else {
          btn.classList.remove('active');
          cont.style.display = 'none';
        }
      });
      
      if (tab === 'leaderboard') populateLeaderboard();
      else if (tab === 'badges') populateBadges();
      else if (tab === 'profile') populateProfile();
      else if (tab === 'stats') populateStats();
    };

    function populateProfile() {
      const username = localStorage.getItem('wgf_username') || 'RetroPlayer';
      const avatar = localStorage.getItem('wgf_avatar') || '👾';
      const badges = JSON.parse(localStorage.getItem('wgf_badges') || '[]');
      
      let title = 'Novice Gamer';
      if (badges.length >= 8) title = 'Factory Legend';
      else if (badges.length >= 5) title = 'Voxel Hero';
      else if (badges.length >= 2) title = 'Star Runner';
      
      const container = document.getElementById('tab-profile-content');
      container.innerHTML = `
        <div style="text-align: center; padding: 15px 0;">
          <div id="profile-avatar-display" style="font-size: 64px; margin-bottom: 10px; filter: drop-shadow(0 0 10px var(--primary-glow));">${avatar}</div>
          <div style="font-size: 18px; font-weight: bold; color: #fff;" id="profile-name-display">${username}</div>
          <div style="font-size: 11px; text-transform: uppercase; color: #00c805; font-weight: bold; margin-top: 4px; letter-spacing: 1px;">${title}</div>
        </div>
        
        <div style="margin-top: 15px;">
          <label style="font-size: 12px; color: #8e8e93; display: block; margin-bottom: 6px;">Edit Username</label>
          <input type="text" id="edit-username-input" value="${username}" style="width: 100%; background: #1c1c1e; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px; border-radius: 6px; font-family: inherit; font-size: 14px; box-sizing: border-box; margin-bottom: 15px;">
          
          <label style="font-size: 12px; color: #8e8e93; display: block; margin-bottom: 6px;">Choose Avatar</label>
          <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px;">
            ${['👾', '🏎️', '🦊', '🚀', '🐱', '🎮', '🛸', '🤖', '👑', '⭐️'].map(emoji => `
              <button onclick="setAvatar('${emoji}')" class="sound-pack-btn ${emoji === avatar ? 'active' : ''}" style="padding: 8px; font-size: 18px; border-radius: 6px;">${emoji}</button>
            `).join('')}
          </div>
          
          <button onclick="saveProfile()" class="sound-pack-btn active" style="width: 100%; padding: 10px; font-weight: bold; border-radius: 6px;">Save Changes</button>
        </div>
      `;
    }
    
    window.setAvatar = function(emoji) {
      localStorage.setItem('wgf_avatar', emoji);
      populateProfile();
    };
    
    window.saveProfile = function() {
      const name = document.getElementById('edit-username-input').value.trim();
      if (name) {
        localStorage.setItem('wgf_username', name);
      }
      populateProfile();
    };

    function populateStats() {
      const stats = JSON.parse(localStorage.getItem('wgf_stats') || '{}');
      const badges = JSON.parse(localStorage.getItem('wgf_badges') || '[]');
      const history = JSON.parse(localStorage.getItem('wgf_scores_v2') || '{}');
      
      let lifetimeScore = 0;
      Object.keys(history).forEach(gameId => {
        if (history[gameId] && history[gameId].length > 0) {
          lifetimeScore += history[gameId][0].score;
        }
      });
      
      const container = document.getElementById('tab-stats-content');
      container.innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px 0;">
          <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; text-align: center;">
            <div style="font-size: 11px; color: #8e8e93; text-transform: uppercase;">Lifetime Score</div>
            <div style="font-size: 18px; font-weight: bold; color: #fff; margin-top: 4px;">${lifetimeScore.toLocaleString()}</div>
          </div>
          <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; text-align: center;">
            <div style="font-size: 11px; color: #8e8e93; text-transform: uppercase;">Badges Earned</div>
            <div style="font-size: 18px; font-weight: bold; color: #00c805; margin-top: 4px;">${badges.length} / ${ACHIEVEMENTS.length}</div>
          </div>
          <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; text-align: center;">
            <div style="font-size: 11px; color: #8e8e93; text-transform: uppercase;">Games Played</div>
            <div style="font-size: 18px; font-weight: bold; color: #fff; margin-top: 4px;">${stats.gamesPlayed || 0}</div>
          </div>
          <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; text-align: center;">
            <div style="font-size: 11px; color: #8e8e93; text-transform: uppercase;">Credits Spent</div>
            <div style="font-size: 18px; font-weight: bold; color: #ffcc00; margin-top: 4px;">${stats.creditsSpent || 0}</div>
          </div>
        </div>
      `;
    }

    document.getElementById('settings-btn').addEventListener('click', () => {
      toggleModal('settings-modal', true);
      const pack = localStorage.getItem('wgf_soundpack') || 'retro';
      document.querySelectorAll('.sound-pack-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('pack-' + pack);
      if (activeBtn) activeBtn.classList.add('active');
      
      const vol = parseFloat(localStorage.getItem('wgf_volume') || '0.5');
      document.getElementById('volume-slider').value = Math.round(vol * 100);
    });

    document.getElementById('scores-btn').addEventListener('click', () => {
      toggleModal('scores-modal', true);
    });

    window.setSoundPack = function(pack) {
      localStorage.setItem('wgf_soundpack', pack);
      document.querySelectorAll('.sound-pack-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('pack-' + pack).classList.add('active');
    }

    window.updateVolume = function(val) {
      localStorage.setItem('wgf_volume', (val / 100).toString());
    };

    // Leaderboard management
    const GAME_TITLES = {
      'cyberpunk-runner': 'Cyberpunk Runner',
      'sci-fi-td': 'Sci-Fi Voxel TD',
      'minimalist-platformer': 'Minimalist Platformer',
      'f1-space-invaders': 'F1 Space Invaders',
      'cosmic-cargo': 'Cosmic Cargo',
      'contra-bonus': 'Contra Bonus',
      'asteroid-belt': 'Asteroid Belt',
      'red-bull-pong': 'Red Bull Pong',
      'voxel-sandbox': 'Voxel Sandbox',
      '2048': '2048',
      'clumsy-bird': 'Clumsy Bird',
      'hextris': 'Hextris',
      'pac-man': 'Pac-Man'
    };

    function populateLeaderboard() {
      const container = document.getElementById('tab-leaderboard-content');
      container.innerHTML = '';
      
      const history = JSON.parse(localStorage.getItem('wgf_scores_v2') || '{}');
      const legacyScores = JSON.parse(localStorage.getItem('wgf_scores') || '{}');
      
      Object.keys(GAME_TITLES).forEach(gameId => {
        const item = document.createElement('div');
        item.style.marginBottom = '12px';
        item.style.padding = '12px';
        item.style.background = 'rgba(255,255,255,0.02)';
        item.style.borderRadius = '8px';
        item.style.border = '1px solid rgba(255,255,255,0.06)';
        
        const header = document.createElement('div');
        header.style.display = 'flex';
        header.style.justifyContent = 'space-between';
        header.style.fontWeight = 'bold';
        header.style.color = '#00c805';
        header.style.fontSize = '14px';
        
        const name = document.createElement('span');
        name.innerText = GAME_TITLES[gameId];
        
        const topScoreVal = history[gameId] && history[gameId].length > 0 
          ? history[gameId][0].score 
          : (legacyScores[gameId] || 0);
          
        const topScore = document.createElement('span');
        topScore.innerText = topScoreVal > 0 ? Math.round(topScoreVal).toLocaleString() : 'No Score';
        
        header.appendChild(name);
        header.appendChild(topScore);
        item.appendChild(header);
        
        // Show top-5 breakdown if history exists
        if (history[gameId] && history[gameId].length > 0) {
          const list = document.createElement('div');
          list.style.marginTop = '8px';
          list.style.fontSize = '11px';
          list.style.color = '#8e8e93';
          
          history[gameId].forEach((entry, idx) => {
            const dateStr = new Date(entry.timestamp).toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
            const row = document.createElement('div');
            row.style.display = 'flex';
            row.style.justifyContent = 'space-between';
            row.style.padding = '4px 0';
            row.style.borderTop = '1px solid rgba(255,255,255,0.03)';
            row.innerHTML = `<span>#${idx+1} (${dateStr})</span><span>${Math.round(entry.score).toLocaleString()}</span>`;
            list.appendChild(row);
          });
          item.appendChild(list);
        }
        
        container.appendChild(item);
      });
    }

    function populateBadges() {
      const container = document.getElementById('tab-badges-content');
      container.innerHTML = '';
      
      const unlocked = JSON.parse(localStorage.getItem('wgf_badges') || '[]');
      
      ACHIEVEMENTS.forEach(ach => {
        const item = document.createElement('div');
        item.style.display = 'flex';
        item.style.alignItems = 'center';
        item.style.gap = '15px';
        item.style.padding = '10px 12px';
        item.style.marginBottom = '8px';
        item.style.borderRadius = '8px';
        
        const isUnlocked = unlocked.includes(ach.id);
        
        if (isUnlocked) {
          item.style.background = 'rgba(0,200,5,0.06)';
          item.style.border = '1px solid rgba(0,200,5,0.2)';
        } else {
          item.style.background = 'rgba(255,255,255,0.02)';
          item.style.border = '1px solid rgba(255,255,255,0.05)';
          item.style.opacity = '0.5';
        }
        
        const badge = document.createElement('div');
        badge.style.width = '32px';
        badge.style.height = '32px';
        badge.style.borderRadius = '50%';
        badge.style.background = isUnlocked ? '#00c805' : '#333';
        badge.style.display = 'flex';
        badge.style.alignItems = 'center';
        badge.style.justifyContent = 'center';
        badge.style.fontSize = '16px';
        badge.innerText = isUnlocked ? '★' : '☆';
        badge.style.color = '#fff';
        badge.style.boxShadow = isUnlocked ? '0 0 10px rgba(0,200,5,0.3)' : 'none';
        
        const info = document.createElement('div');
        info.style.flex = '1';
        
        const title = document.createElement('div');
        title.style.fontWeight = 'bold';
        title.style.fontSize = '13px';
        title.style.color = isUnlocked ? '#fff' : '#8e8e93';
        title.innerText = ach.title;
        
        const desc = document.createElement('div');
        desc.style.fontSize = '11px';
        desc.style.color = '#8e8e93';
        desc.innerText = ach.desc;
        
        info.appendChild(title);
        info.appendChild(desc);
        item.appendChild(badge);
        item.appendChild(info);
        container.appendChild(item);
      });
    }

    // Fullscreen Overlay controls
    // Fullscreen Overlay controls
    window.launchGameIframe = function(url) {
      const overlay = document.getElementById('game-overlay');
      const iframe = document.getElementById('game-iframe');
      
      // Increment stats
      try {
        const stats = JSON.parse(localStorage.getItem('wgf_stats') || '{}');
        stats.gamesPlayed = (stats.gamesPlayed || 0) + 1;
        localStorage.setItem('wgf_stats', JSON.stringify(stats));
      } catch(e){}

      // Inject standard audio controls query parameters
      const soundpack = localStorage.getItem('wgf_soundpack') || 'retro';
      const volume = localStorage.getItem('wgf_volume') || '0.5';
      const separator = url.includes('?') ? '&' : '?';
      const fullUrl = `${url}${separator}soundpack=${soundpack}&volume=${volume}`;

      iframe.src = fullUrl;
      overlay.style.display = 'block';
    };

    window.closeGameIframe = function() {
      const overlay = document.getElementById('game-overlay');
      const iframe = document.getElementById('game-iframe');
      iframe.src = 'about:blank';
      overlay.style.display = 'none';

      // Resume Hub cards active blocking inputs if any
      window.__WGF_HUB_CARD_INPUT_BLOCKED_UNTIL = performance.now() + 500;
    };

    // postMessage API Receiver
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'WGF_SCORE') {
        const { gameId, score } = event.data;
        if (!gameId || score === undefined) return;
        
        // Award credits (1 credit per 10 points)
        try {
          const earned = Math.floor(score / 10);
          if (earned > 0) {
            const currentCredits = parseInt(localStorage.getItem('wgf_player_credits') || '0');
            localStorage.setItem('wgf_player_credits', (currentCredits + earned).toString());
          }
        } catch(e){}

        // Save to legacy high scores
        const scores = JSON.parse(localStorage.getItem('wgf_scores') || '{}');
        const currentHighScore = scores[gameId] || 0;
        let isNewRecord = false;
        
        if (score > currentHighScore) {
          scores[gameId] = score;
          localStorage.setItem('wgf_scores', JSON.stringify(scores));
          isNewRecord = true;
        }

        // Save to top-5 history
        const history = JSON.parse(localStorage.getItem('wgf_scores_v2') || '{}');
        if (!history[gameId]) history[gameId] = [];
        history[gameId].push({ score: Math.round(score), timestamp: Date.now() });
        // Sort descending, keep top 5
        history[gameId].sort((a, b) => b.score - a.score);
        history[gameId] = history[gameId].slice(0, 5);
        localStorage.setItem('wgf_scores_v2', JSON.stringify(history));

        // Check achievements and unlock badges
        const unlocked = JSON.parse(localStorage.getItem('wgf_badges') || '[]');
        let unlockedNewBadge = false;
        ACHIEVEMENTS.forEach(ach => {
          if (!unlocked.includes(ach.id) && ach.check(gameId, score)) {
            unlocked.push(ach.id);
            unlockedNewBadge = true;
          }
        });
        if (unlockedNewBadge) {
          localStorage.setItem('wgf_badges', JSON.stringify(unlocked));
        }

        // Audio feedback for high score or badge unlock
        if (isNewRecord || unlockedNewBadge) {
          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            // Neon high pitch slide
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(unlockedNewBadge ? 2200 : 1760, audioCtx.currentTime + 0.3);
            
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
          } catch(e){}
        }
      }
    });
  </script>
