<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Modern neon green glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050a" />
      <stop offset="100%" stop-color="#121224" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" stroke="#00c805" stroke-width="6" stroke-opacity="0.15" />

  <!-- Outer Controller Silhouette -->
  <g filter="url(#glow)">
    <!-- Gamepad Body -->
    <path d="M 120 180 
             L 392 180 
             A 60 60 0 0 1 452 240 
             L 432 360 
             A 30 30 0 0 1 402 390 
             L 340 370
             L 310 330
             L 202 330
             L 172 370
             L 110 390
             A 30 30 0 0 1 80 360
             L 60 240
             A 60 60 0 0 1 120 180 Z" 
          fill="none" 
          stroke="#00c805" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- D-PAD (Left Side) -->
    <path d="M 150 260 H 170 V 240 H 190 V 260 H 210 V 280 H 190 V 300 H 170 V 280 H 150 Z" 
          fill="#00c805" 
          opacity="0.85" />

    <!-- Action Buttons (Right Side) -->
    <circle cx="320" cy="270" r="14" fill="#ff00ff" />
    <circle cx="360" cy="270" r="14" fill="#00ffff" />
    <circle cx="340" cy="245" r="14" fill="#ffcc00" />
    <circle cx="340" cy="295" r="14" fill="#ff3b30" />

    <!-- Center Logo Details -->
    <rect x="236" y="260" width="16" height="30" rx="4" fill="#00c805" opacity="0.6" transform="rotate(-30 244 275)" />
    <rect x="260" y="260" width="16" height="30" rx="4" fill="#00c805" opacity="0.6" transform="rotate(-30 268 275)" />
  </g>

  <!-- Title Text -->
  <text x="256" y="440" 
        fill="#00c805" 
        font-family="'Outfit', 'Segoe UI', sans-serif" 
        font-size="32" 
        font-weight="bold" 
        letter-spacing="4" 
        text-anchor="middle" 
        filter="url(#glow)">WGF</text>
</svg>
