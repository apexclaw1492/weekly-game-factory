<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="./favicon.ico">
  <title>Weekly Game Factory</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #03020b;
      overflow: hidden;
      position: fixed;
      font-family: 'Courier New', Courier, monospace;
      -webkit-overflow-scrolling: none;
      -webkit-text-size-adjust: 100%;
      touch-action: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #03020b;
    }
    canvas {
      display: block;
    }
    #version-badge {
      position: fixed;
      top: max(8px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 4px 8px;
      border: 1px solid rgba(0, 204, 255, 0.45);
      background: rgba(3, 2, 11, 0.72);
      color: #00ccff;
      font: 700 10px/1.2 'Courier New', Courier, monospace;
      letter-spacing: 0;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }
  </style>

</head>
<body>
  <div id="version-badge">v1.3.7 - Published 2026-06-03</div>
  <div id="game-container"></div>
</body>
</html>
