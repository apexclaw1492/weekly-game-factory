<!DOCTYPE html>
<html>
<head><title>Minimal Test</title></head>
<body style="background:#111;margin:0">
<div id="game"></div>
<script type="importmap">
{
  "imports": {
    "phaser": "./node_modules/phaser/dist/phaser.esm.js"
  }
}
</script>
<script type="module">
import Phaser from 'phaser';

class MiniScene extends Phaser.Scene {
  constructor() { super('Mini'); }
  create() {
    this.add.rectangle(400, 300, 200, 200, 0xff0000);
    this.add.text(400, 300, 'TEST', {fontSize:'32px',color:'#ffffff'}).setOrigin(0.5);
    console.log('Scene created!');
  }
}

const game = new Phaser.Game({
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  backgroundColor: '#333366',
  parent: 'game',
  scene: [MiniScene]
});

console.log('Game created!');
</script>
</body>
</html>
