<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>F1 Space Invaders — Weekly Game Factory</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0a0a12;
      color: #e8e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a12;
    }
    #game-canvas {
      display: block;
      image-rendering: auto;
    }
    .game-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 0.6rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: rgba(10,10,18,0.8);
      font-size: 0.8rem;
      font-family: 'Courier New', monospace;
    }
    .game-header a { color: #ff6b35; text-decoration: none; }
    .game-header a:hover { text-decoration: underline; }
    .game-header .title { color: #8888a0; }
    .controls-hint {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.4rem 1rem;
      background: rgba(0,0,0,0.7);
      border-radius: 20px;
      font-size: 0.75rem;
      color: #8888a0;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div class="game-header">
    <span class="title">F1 Space Invaders — Week 0</span>
    <a href="../../">← Back to Factory</a>
  </div>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>
  <div class="controls-hint">← → to move | SPACE to shoot | Tap to start/shoot</div>
  <script src="game.js"></script>
</body>
</html>
