<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Pac-Man - Weekly Game Factory</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; form-action 'none'; upgrade-insecure-requests">
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="style.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f1c40f">
    <link rel="manifest" href="manifest.json">
    <style>
      body {
        touch-action: none;
      }
      .game-wrapper {
        filter: drop-shadow(0px 0px 20px rgba(241, 196, 15, 0.5));
      }
      .wgf-overlay {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(241, 196, 15, 0.9);
        color: #000;
        padding: 10px 15px;
        border-radius: 8px;
        font-family: sans-serif;
        font-weight: bold;
        font-size: 14px;
        pointer-events: none;
        z-index: 9999;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        backdrop-filter: blur(4px);
      }
    </style>
  </head>
  <body>
    <div class="wgf-overlay">🌟 Weekly Game Factory</div>
    <!-- Back to Hub -->
    <div class="hub-bar">
      <a href="../../" class="back-to-hub">← Back to Hub</a>
      <span class="hub-label">Part of <strong>Weekly Game Factory</strong></span>
    </div>

    <div class="game-wrapper">
      <div class="grid"></div>
      <h3>Score: <span id="score"></span></h3>

      <!-- Touch D-Pad for mobile -->
      <div class="dpad" id="dpad">
        <button class="dpad-btn dpad-up" data-dir="ArrowUp">▲</button>
        <button class="dpad-btn dpad-left" data-dir="ArrowLeft">◀</button>
        <button class="dpad-btn dpad-right" data-dir="ArrowRight">▶</button>
        <button class="dpad-btn dpad-down" data-dir="ArrowDown">▼</button>
      </div>
    </div>

    <script src="app.js"></script>
    <script>
      document.addEventListener('click', function() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        } catch (e) {}
      });
    </script>
  </body>
</html>
